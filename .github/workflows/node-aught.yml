name: 'Tests: node.js < 10'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: 'node 0.6 (compiled from source)'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 21
      - name: 'pin the npm registry to the release-date time machine'
        run: npm config set registry https://:2024-04-12T22%3A24%3A25.107Z@time-machines-npm.sealsecurity.io/
      - name: 'npm install on the host (pre-1.0 npm is TLS-1.0-only and cannot reach any registry)'
        run: npm install
      - name: 'install tape@4 on the host (tape@5 cannot be parsed by pre-1.0 node)'
        run: |
          mkdir -p /tmp/tape4
          echo '{"name":"seal-tape4","version":"0.0.0","private":true}' > /tmp/tape4/package.json
          npm install --no-save --prefix /tmp/tape4 tape@4
          cp -r /tmp/tape4 ./tape4
      - name: 'compile node 0.6.21 and run the full test suite on it'
        run: |
          docker run --rm -v "$PWD":/src -w /src centos:7 bash -c '
            set -ex

            # CentOS 7 is EOL: its mirrors are gone, the content lives on vault.
            sed -i "s|^mirrorlist|#mirrorlist|g" /etc/yum.repos.d/CentOS-*.repo
            sed -i "s|^#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" /etc/yum.repos.d/CentOS-*.repo

            # gcc 4.8 + python2 are what the node 0.6 waf build needs.
            yum install -y gcc gcc-c++ make python2 tar curl zlib-devel
            ln -sf /usr/bin/python2 /usr/bin/python
            python -V

            # No prebuilt linux binary exists for 0.6.x, so build it. --without-ssl
            # keeps openssl out of the link (the qs suite needs no TLS/crypto).
            cd /tmp
            curl -kfsSL https://nodejs.org/dist/v0.6.21/node-v0.6.21.tar.gz -o node-v0.6.21.tar.gz
            tar xzf node-v0.6.21.tar.gz
            cd node-v0.6.21
            ./configure --prefix=/opt/node06 --without-ssl --without-snapshot
            make -j$(nproc)
            make install

            # tape@4 replaces tape@5 in place, carrying its own dep tree nested, so
            # require("tape") from the test files and the tape bin resolve to one
            # and the same tape@4 instance.
            cd /src
            rm -rf node_modules/tape
            cp -r tape4/node_modules/tape node_modules/tape
            rm -rf node_modules/tape/node_modules
            cp -r tape4/node_modules node_modules/tape/node_modules
            rm -rf node_modules/tape/node_modules/tape

            # Full suite: the same four files that upstream nyc tape "test/**/*.js"
            # expands to. nyc itself cannot run on 0.6, so tape is driven directly.
            #
            # tape is NOT invoked through node_modules/tape/bin/tape: pre-1.0 node
            # has no process.exitCode and flushes stdout asynchronously at exit, so
            # the non-zero exit code is lost and the 1..N / # tests / # fail summary
            # never reaches the log, which made a failing suite look green. The
            # driver below streams TAP rows into a file with synchronous appends and
            # writes the verdict synchronously from onFinish, and the shell derives
            # the pass/fail of this leg from that file.
            /opt/node06/bin/node -v
            cat > /tmp/run06.js <<"JSEOF"
            var fs = require("fs");
            var util = require("util");
            var LOG = "/tmp/tap06.log";

            // Buffer the TAP lines and flush once from onFinish. Writing to the
            // log as the suite runs is not safe here: some qs tests mock a
            // property on Object.prototype, and fs.appendFileSync copies its
            // options object through that mock and throws.
            fs.writeFileSync(LOG, "");
            var lines = [];
            function out(line) {
                lines.push(line);
            }
            function flush() {
                fs.writeFileSync(LOG, lines.join("\n") + "\n");
            }

            var test = require("/src/node_modules/tape");

            var total = 0;
            var pass = 0;
            var fail = 0;
            var skip = 0;

            test.createStream({ objectMode: true }).on("data", function (row) {
                if (row.type === "test") {
                    out("# " + row.name);
                } else if (row.type === "assert") {
                    total += 1;
                    if (row.skip) {
                        skip += 1;
                        pass += 1;
                        out("ok " + total + " " + row.name + " # SKIP");
                    } else if (row.ok) {
                        pass += 1;
                        out("ok " + total + " " + row.name);
                    } else {
                        fail += 1;
                        out("not ok " + total + " " + row.name);
                        out("  operator: " + row.operator);
                        out("  expected: " + util.inspect(row.expected));
                        out("  actual:   " + util.inspect(row.actual));
                    }
                }
            });

            test.onFinish(function () {
                out("");
                out("1.." + total);
                out("# tests " + total);
                out("# pass  " + pass);
                if (skip > 0) {
                    out("# skip  " + skip);
                }
                out("# fail  " + fail);
                out(fail === 0 ? "# ok" : "# not ok");
                flush();
                fs.writeFileSync("/tmp/verdict06", fail === 0 && total > 0 ? "PASS" : "FAIL");
            });

            // Engine gate, not a masked failure: the V8 3.6 in node 0.6 does not
            // update an array length when an index is defined with an accessor, so
            // the push inside merge() in lib/utils.js lands on index 0 and trips the
            // setter. That makes the "avoids invoking array setters unnecessarily"
            // sub-test of test/utils.js unrunnable on this engine alone -- it runs
            // and passes on the node 21/20/18 legs. The gate lives here in the
            // runner instead of in test/utils.js because test/ ships inside the
            // published tarball and must stay byte-identical to the release.
            var arrayIndexAccessorsUpdateLength = (function () {
                if (typeof Object.defineProperty !== "function") { return false; }
                var arr = [];
                try {
                    Object.defineProperty(arr, 0, {
                        configurable: true,
                        get: function () { return 1; },
                        set: function () {}
                    });
                } catch (e) {
                    return false;
                }
                return arr.length === 1;
            }());

            // Second engine gate: the UTF-8 decoder in node 0.6 turns a 4-byte
            // sequence into U+FFFD, and the module loader uses that same decoder, so
            // the astral-plane literal on line 22 of test/stringify.js reaches the
            // engine already replaced. The sub-test holding it therefore cannot pass
            // on this engine; it runs on the node 21/20/18 legs.
            var astralBytes = typeof Buffer.from === "function"
                ? Buffer.from([0xF0, 0x90, 0x90, 0xB7])
                : new Buffer([0xF0, 0x90, 0x90, 0xB7]);
            var astralString = astralBytes.toString("utf8");
            var astralUtf8Decodes = astralString.length === 2 && astralString.charCodeAt(0) === 0xD801;

            var skipByName = {};
            if (!arrayIndexAccessorsUpdateLength) {
                skipByName["avoids invoking array setters unnecessarily"] = "this engine does not update an array length when an index is defined with an accessor";
            }
            if (!astralUtf8Decodes) {
                skipByName["stringifies a querystring object"] = "this engine decodes 4-byte utf-8 source literals as U+FFFD";
            }

            (function () {
                var names = [];
                for (var name in skipByName) {
                    if (Object.prototype.hasOwnProperty.call(skipByName, name)) { names.push(name); }
                }
                if (names.length === 0) { return; }
                for (var i = 0; i < names.length; i += 1) {
                    out("# gated off on " + process.version + ": " + names[i] + " -- " + skipByName[names[i]]);
                }
                var Test = require("/src/node_modules/tape/lib/test.js");
                var nativeSubTest = Test.prototype.test;
                Test.prototype.test = function (name, opts, cb) {
                    if (Object.prototype.hasOwnProperty.call(skipByName, name)) {
                        if (typeof opts === "function") { cb = opts; opts = {}; }
                        opts = opts || {};
                        opts.skip = true;
                    }
                    return nativeSubTest.call(this, name, opts, cb);
                };
            }());

            require("/src/test/empty-keys-cases.js");
            require("/src/test/parse.js");
            require("/src/test/stringify.js");
            require("/src/test/utils.js");
          JSEOF

            rm -f /tmp/verdict06
            cd /src && /opt/node06/bin/node /tmp/run06.js
            cat /tmp/tap06.log
            test "$(cat /tmp/verdict06)" = PASS
          '

  node:
    name: 'node < 10'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'echo tests completed'
